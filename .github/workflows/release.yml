name: Release binaries
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for build-only validation (vX.Y.Z)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check installer and wrapper syntax
        run: sh -n scripts/install.sh scripts/build-release.sh internal/bootstrap/mockstrow
      - run: go test ./...
      - run: go vet ./...
      - name: Build macOS and Linux assets
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          scripts/build-release.sh "$RELEASE_VERSION"
          (cd dist && sha256sum --check checksums.txt)
          "./dist/mockstro_${RELEASE_VERSION}_linux_amd64" --version
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes
