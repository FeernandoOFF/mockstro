<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="mockstro-token" content="__TOKEN__">
<title>Mockstro</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
:root {
  --bg: #ffffff; --bg-side: #f7f7f8; --bg-hover: #f1f1f3; --bg-active: #ebebee;
  --line: #e8e8eb; --line-strong: #d8d8de;
  --text: #17171a; --muted: #6b6b76; --faint: #9a9aa4;
  --primary: #111113; --primary-text: #ffffff;
  --ok: #1a8f4c; --ok-bg: #e8f6ee; --warn: #c27d12; --warn-bg: #fff6e8; --warn-line: #f2dcb6; --warn-text: #7a4b00;
  --bad: #c0362c; --bad-bg: #fdeeed;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161618; --bg-side: #1b1b1e; --bg-hover: #222226; --bg-active: #2b2b30;
    --line: #2a2a2f; --line-strong: #3a3a41;
    --text: #ececef; --muted: #9a9aa5; --faint: #6f6f79;
    --primary: #f2f2f4; --primary-text: #111113;
    --ok: #4fc27a; --ok-bg: #16301f; --warn: #e0a43a; --warn-bg: #2b2412; --warn-line: #4a3a18; --warn-text: #e6c07a;
    --bad: #ff7b72; --bad-bg: #35201f;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; font: 13.5px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
a { color: inherit; }
svg { display: block; }
:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }

/* buttons, inputs, small parts */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--bg); cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--bg-hover); }
.btn.primary { background: var(--primary); color: var(--primary-text); border-color: var(--primary); font-weight: 550; }
.btn.primary:hover { opacity: .88; }
.btn.sm { height: 26px; padding: 0 10px; font-size: 12.5px; }
.btn.danger { color: var(--bad); }
.btn.ghost { border-color: transparent; background: none; }
.btn.ghost:hover { background: var(--bg-hover); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn svg { width: 15px; height: 15px; }
.input { height: 30px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--bg); width: 100%; }
textarea.input { height: auto; padding: 8px 10px; font: 12.5px/1.45 var(--mono); resize: vertical; }
.search { position: relative; width: 260px; } .search svg { position: absolute; left: 9px; top: 7px; width: 15px; height: 15px; color: var(--faint); } .search .input { padding-left: 30px; }
.badge { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 5px; font-size: 12px; font-weight: 550; background: var(--bg-hover); color: var(--muted); }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.ok { background: var(--ok-bg); color: var(--ok); } .badge.warn { background: var(--warn-bg); color: var(--warn); } .badge.bad { background: var(--bad-bg); color: var(--bad); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 6px; background: var(--bg-hover); color: var(--muted); font-size: 12.5px; border: 0; white-space: nowrap; }
.chip svg { width: 14px; height: 14px; }
.chip.dashed { background: none; border: 1px dashed var(--line-strong); max-width: 340px; overflow: hidden; text-overflow: ellipsis; display: inline-block; line-height: 24px; }
.chip.dashed svg { display: inline-block; vertical-align: -2px; margin-right: 6px; }
button.chip { cursor: pointer; } button.chip:hover { color: var(--text); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.fail { background: var(--bad); }
.muted { color: var(--muted); } .mono { font-family: var(--mono); font-size: 12.5px; } .grow { flex: 1; min-width: 0; }

/* shell */
.shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); height: 100vh; }
.sidebar { background: var(--bg-side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; padding: 14px 10px 10px; }
.brand { display: flex; gap: 10px; align-items: center; padding: 4px 8px 16px; font-weight: 650; font-size: 15px; letter-spacing: -.01em; }
.mark { width: 26px; height: 26px; object-fit: contain; flex: none; }
.nav { overflow: auto; flex: 1; min-height: 0; }
.nav a, .navbtn { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: 6px; text-decoration: none; cursor: pointer; border: 0; background: none; width: 100%; text-align: left; }
.nav a:hover, .navbtn:hover { background: var(--bg-hover); }
.nav a[aria-current="page"] { background: var(--bg-active); font-weight: 600; }
.nav .label, .navbtn .label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav svg { width: 16px; height: 16px; flex: none; color: var(--muted); } .nav a[aria-current="page"] svg { color: var(--text); }
.count { margin-left: auto; color: var(--muted); font-size: 12px; font-weight: 400; font-variant-numeric: tabular-nums; }
.glabel { display: flex; align-items: center; justify-content: space-between; margin: 18px 10px 4px; font-size: 12px; color: var(--muted); }
.glabel button { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 2px; border-radius: 4px; display: grid; } .glabel button:hover { background: var(--bg-hover); color: var(--text); } .glabel svg { width: 14px; height: 14px; }
.proj { gap: 8px !important; }
.sq { width: 12px; height: 12px; border-radius: 3px; flex: none; }
.sq.pic { width: 16px; height: 16px; margin: 0 -2px; border-radius: 4px; object-fit: contain; }
.sub { padding-left: 30px !important; height: 28px !important; color: var(--muted); font-size: 13px; }
.sub svg { width: 14px !important; height: 14px !important; }
.sidefoot { border-top: 1px solid var(--line); padding: 10px 4px 0; display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--muted); }
.sidecheck { display: flex; align-items: center; gap: 8px; height: 26px; padding: 0 6px; margin: 0 0 6px; border-radius: 6px; font-size: 12px; color: var(--muted); text-decoration: none; }
.sidecheck:hover, .sidecheck[aria-current="page"] { background: var(--bg-hover); color: var(--text); }
.sidecheck svg { width: 13px; height: 13px; flex: none; } .sidecheck .dot { width: 6px; height: 6px; margin-left: auto; }
.sidefoot .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.topbar { height: 48px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 24px; border-bottom: 1px solid var(--line); }
.crumbs { display: flex; gap: 8px; color: var(--muted); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; }
.crumbs b { color: var(--text); font-weight: 600; } .crumbs .sep { color: var(--faint); }
.scroll { flex: 1; overflow: auto; min-height: 0; display: flex; flex-direction: column; }
#content { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#content > .page { flex: 1; }
.page { display: grid; grid-template-columns: minmax(0, 1fr) 320px; min-height: 100%; }
.page.single { grid-template-columns: minmax(0, 1fr); }
.col { min-width: 0; }
.head { padding: 24px 28px 18px; }
.head .top { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; }
.head .titleline { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.head h1 { font-size: 22px; line-height: 1.25; margin: 0; font-weight: 650; letter-spacing: -.015em; word-break: break-word; }
.session-path { display: flex; align-items: center; gap: 6px; margin-top: 8px; color: var(--muted); min-width: 0; }
.session-path code { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 12px var(--mono); }
.session-path .btn { opacity: 0; padding: 0 5px; flex: none; }
.session-path:hover .btn, .session-path:focus-within .btn { opacity: 1; }
@media (hover: none) { .session-path .btn { opacity: 1; } }
.head .lede { color: var(--muted); margin: 6px 0 0; }
.actions { display: flex; gap: 8px; flex: none; align-items: center; }
.banner { margin: 16px 28px 0; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 6px; background: var(--warn-bg); border: 1px solid var(--warn-line); color: var(--warn-text); }
.banner.bad { background: var(--bad-bg); border-color: transparent; color: var(--bad); }
.banner svg { width: 16px; height: 16px; flex: none; }
.banner button { background: none; border: 0; font-weight: 650; color: inherit; cursor: pointer; padding: 0; }
.tabs { display: flex; overflow-x: auto; gap: 24px; padding: 0 28px; margin-top: 2px; border-bottom: 1px solid var(--line); }
.tab { flex: none; background: none; border: 0; padding: 10px 0; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--text); font-weight: 600; border-bottom-color: var(--text); }
.tab small { color: var(--faint); margin-left: 5px; font-weight: 400; font-size: 12px; }

/* rows */
.row { display: flex; align-items: center; gap: 16px; padding: 11px 28px; border-bottom: 1px solid var(--line); }
.row:hover { background: var(--bg-side); }
.row.click { cursor: pointer; }
.row.active { box-shadow: inset 2px 0 0 var(--ok); }
.gh { padding: 7px 28px; background: var(--bg-side); color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--line); }
.rt { font-weight: 550; } .rd { color: var(--muted); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; } .rm { color: var(--faint); font-size: 12px; margin-top: 3px; }
.bar { display: flex; align-items: center; gap: 4px; padding: 10px 28px; border-bottom: 1px solid var(--line); }
.seg { border: 0; background: none; padding: 3px 10px; border-radius: 5px; color: var(--muted); cursor: pointer; } .seg:hover { background: var(--bg-hover); } .seg[aria-pressed="true"] { background: var(--bg-active); color: var(--text); font-weight: 600; } .seg small { margin-left: 5px; font-weight: 400; color: var(--faint); }
.req .t { width: 70px; color: var(--muted); font: 12.5px var(--mono); flex: none; }
.req .m { width: 54px; font: 600 11.5px var(--mono); color: var(--muted); flex: none; }
.req .p { flex: 1; min-width: 0; font: 12.5px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.req .by { color: var(--muted); max-width: 38%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; }
.req.bad .p, .req.bad .by { color: var(--bad); }
.req.custom .by { color: var(--text); font-weight: 550; }
.empty { padding: 72px 28px; text-align: center; color: var(--muted); }
.empty .ring { width: 44px; height: 44px; border-radius: 50%; background: var(--bg-hover); display: grid; place-items: center; margin: 0 auto 14px; color: var(--muted); } .empty .ring svg { width: 20px; height: 20px; }
.empty h2 { margin: 0 0 4px; font-size: 15px; color: var(--text); } .empty p { margin: 0 auto 16px; max-width: 380px; }
.note { padding: 14px 28px; color: var(--muted); }
.logline { display: flex; gap: 12px; padding: 5px 28px; font: 12.5px/1.5 var(--mono); border-bottom: 1px solid var(--line); } .logline .t { color: var(--faint); flex: none; } .logline.error { color: var(--bad); } .logline.warn { color: var(--warn); }

/* panel */
.panel { border-left: 1px solid var(--line); padding: 22px 24px; }
.ph { display: flex; justify-content: space-between; align-items: baseline; font-weight: 650; margin: 0 0 4px; } .ph span { font-weight: 400; color: var(--muted); font-size: 12.5px; }
.ph + .kv, .ph + .frows { margin-bottom: 26px; }
.kvr { display: flex; justify-content: space-between; gap: 16px; padding: 9px 0; border-bottom: 1px solid var(--line); } .kvr > span:first-child { color: var(--muted); flex: none; } .kvr > span:last-child { text-align: right; word-break: break-word; min-width: 0; }
.frow { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; }
.frow:hover .tt { text-decoration: underline; }
.fico { width: 32px; height: 28px; border-radius: 6px; display: grid; place-items: center; flex: none; } .fico svg { width: 16px; height: 16px; }
.frow .tt { font-weight: 550; } .frow small { display: block; color: var(--muted); font-size: 12px; font-family: var(--mono); }
.frow > svg { width: 14px; height: 14px; color: var(--faint); margin-left: auto; flex: none; }
.panel .hintp { color: var(--muted); margin: 8px 0 0; }

/* setup page */
.check { display: flex; gap: 14px; padding: 13px 28px; border-bottom: 1px solid var(--line); }
.check .ic { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; flex: none; margin-top: 1px; font-size: 11px; font-weight: 700; background: var(--bg-hover); color: var(--muted); }
.check .ic.ok { background: var(--ok-bg); color: var(--ok); } .check .ic.warn { background: var(--warn-bg); color: var(--warn); } .check .ic.fail { background: var(--bad-bg); color: var(--bad); }
.check .ct { font-weight: 550; } .check .cd { color: var(--muted); } .check .cf { margin-top: 3px; }
details.fold { border-bottom: 1px solid var(--line); } details.fold > summary { list-style: none; cursor: pointer; padding: 13px 28px; font-weight: 550; display: flex; align-items: center; gap: 8px; } details.fold > summary::-webkit-details-marker { display: none; } details.fold > summary svg { width: 14px; height: 14px; color: var(--muted); transition: transform .12s; } details.fold[open] > summary svg { transform: rotate(90deg); }
details.fold .inner { padding: 0 28px 16px; }
table.rules { width: 100%; border-collapse: collapse; } table.rules td, table.rules th { text-align: left; padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); font: 12.5px var(--mono); word-break: break-all; vertical-align: top; } table.rules th { color: var(--muted); font-weight: 500; }

/* library: profile group folds */
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 28px 16px; }
.pillbtn { border: 1px solid var(--line-strong); background: none; border-radius: 999px; padding: 3px 11px; color: var(--muted); cursor: pointer; font-size: 12.5px; }
.pillbtn:hover { background: var(--bg-hover); } .pillbtn[aria-pressed="true"] { background: var(--primary); color: var(--primary-text); border-color: var(--primary); } .pillbtn small { margin-left: 5px; opacity: .7; }
.fold .fname { font-weight: 600; } .fold .fcount { color: var(--muted); font-weight: 400; font-size: 12.5px; }
.fold-head { display: flex; align-items: center; gap: 8px; width: 100%; padding: 13px 28px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; cursor: pointer; }
.fold-head:hover { background: var(--bg-hover); }
.fold-head > svg { width: 14px; height: 14px; color: var(--muted); flex: none; transition: transform .12s; }
.fold.open > .fold-head > svg { transform: rotate(90deg); }
.fold.nested > .fold-head { padding-left: 46px; background: var(--bg-side); color: var(--muted); font-weight: 500; font-size: 13px; }
.fold.nested > .fold-head .fname { font-weight: 500; }
.fold > .fold-body > .row { padding-left: 46px; }
.fold.nested > .fold-body > .row, .fold.nested > .fold-body > .gh { padding-left: 64px; }

/* remote config editor */
.segs { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 6px; overflow: hidden; flex: none; }
.segs button { border: 0; background: none; padding: 3px 14px; cursor: pointer; color: var(--muted); font: 12.5px var(--mono); }
.segs button + button { border-left: 1px solid var(--line-strong); }
.segs button[aria-pressed="true"] { background: var(--primary); color: var(--primary-text); }
.fbv { width: 300px; height: 28px; font: 12.5px var(--mono); }
.fbmark { font-size: 11.5px; color: var(--warn); margin-left: 10px; font-weight: 600; }
.fb-bar { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); padding: 12px 28px; display: flex; gap: 8px; align-items: center; }
.fb-intro { padding: 16px 28px 4px; margin: 0; }
.fb-note { padding: 6px 28px 0; margin: 0; min-height: 22px; }
.fb-add { display: flex; gap: 8px; padding: 14px 28px; border-bottom: 1px solid var(--line); } .fb-add .input { flex: 1; font-family: var(--mono); font-size: 12.5px; }

/* welcome */
.welcome { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
.welcome .card { width: min(520px, 100%); }
.welcome h1 { font-size: 24px; letter-spacing: -.015em; margin: 18px 0 6px; } .welcome .card > p { color: var(--muted); margin: 0 0 22px; }
.pathrow { display: flex; gap: 8px; margin-top: 8px; }
.chooser { display: flex; flex-direction: column; gap: 22px; }
.chooser .recents { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.recentitem { border-top: 1px solid var(--line); } .recentitem:first-child { border-top: 0; }
.recentrow { display: flex; align-items: center; }
.rowpick:not(:empty) { padding: 0 12px 12px; } .rowpick .callout { margin-top: 0; }
.recent { display: flex; gap: 10px; align-items: center; flex: 1; min-width: 0; padding: 10px 12px; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.recent:hover:not(:disabled) { background: var(--bg-hover); } .recent:disabled { cursor: default; }
.recentrow .rm { margin: 0 8px; color: var(--faint); } .recentrow .rm:hover { color: var(--bad); }
.confirm { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; background: var(--bad-bg); }
.confirm > svg { width: 16px; height: 16px; color: var(--bad); flex: none; } .confirm .what { flex: 1; min-width: 0; } .confirm small { display: block; color: var(--muted); font-size: 12px; }
.btn.danger-solid { background: var(--bad); border-color: var(--bad); color: #fff; font-weight: 550; } .btn.danger-solid:hover { opacity: .88; }
.recent .what { flex: 1; min-width: 0; } .recent small { display: block; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
.recent .go { color: var(--faint); width: 15px; height: 15px; flex: none; } .recent:hover:not(:disabled) .go { color: var(--text); }
.chooser-tabs { display: inline-flex; gap: 2px; padding: 2px; border-radius: 7px; background: var(--bg-hover); margin-bottom: 14px; }
.chooser-tabs .seg { padding: 5px 12px; } .chooser-tabs .seg[aria-pressed="true"] { background: var(--bg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.clonerow .input { font-family: var(--mono); font-size: 12.5px; }
.dest { margin-top: 6px; color: var(--faint); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .dest b { color: var(--muted); font-weight: 600; }
.spin { width: 13px; height: 13px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.callout { margin-top: 14px; padding: 14px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg-hover); font-size: 13px; line-height: 1.5; }
.callout.bad { background: var(--bad-bg); border-color: color-mix(in srgb, var(--bad) 25%, transparent); }
.callout.warn { background: var(--warn-bg); border-color: var(--warn-line); }
.callout .ttl { display: flex; align-items: center; gap: 8px; font-weight: 650; margin-bottom: 4px; } .callout .ttl svg { width: 16px; height: 16px; flex: none; }
.callout.bad .ttl { color: var(--bad); } .callout.warn .ttl { color: var(--warn-text); }
.callout p { margin: 0 0 10px; color: var(--text); } .callout p:last-child { margin-bottom: 0; }
.callout ol { margin: 0 0 10px; padding-left: 20px; } .callout li { margin: 4px 0; } .callout li::marker { color: var(--muted); font-weight: 600; }
.callout a { color: inherit; font-weight: 600; text-underline-offset: 2px; }
.cmd { display: flex; align-items: center; gap: 8px; margin: 6px 0 4px; padding: 4px 4px 4px 10px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--bg); }
.cmd code { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; font: 12.5px/1.6 var(--mono); }
.callout .more { margin-top: 10px; padding-top: 10px; border-top: 1px solid color-mix(in srgb, currentColor 12%, transparent); font-size: 12.5px; color: var(--muted); }
.callout .more a { display: inline-block; margin-right: 14px; }
.brlist { margin: 8px 0 10px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--bg); overflow: hidden; }
.brrow { display: flex; align-items: center; gap: 10px; padding: 7px 8px 7px 12px; border-top: 1px solid var(--line); } .brrow:first-child { border-top: 0; } .brrow > svg { width: 14px; height: 14px; color: var(--muted); flex: none; }
.brrow code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 12.5px var(--mono); } .brrow small { color: var(--faint); font-size: 12px; white-space: nowrap; }
.callout .loading { display: flex; align-items: center; gap: 8px; color: var(--muted); margin: 0 0 10px; }
.callout details { margin-top: 8px; font-size: 12px; color: var(--muted); } .callout summary { cursor: pointer; }

function pretty(body, headers) {
  const ct = Object.entries(headers || {}).find(([k]) => k.toLowerCase() === 'content-type');
  if (ct && !/json/i.test(ct[1])) return body;
  try { return JSON.stringify(JSON.parse(body), null, 2); } catch { return body; }
}
const headersToText = (hs) => Object.entries(hs || {}).map(([k, v]) => k + ': ' + v).join('\n');
function textToHeaders(t) {
  const out = {};
  for (const line of t.split('\n')) {
    const i = line.indexOf(':');
    if (!line.trim()) continue;
    if (i < 1) throw new Error('Header lines need the form Name: value (got "' + line.trim() + '")');
    out[line.slice(0, i).trim()] = line.slice(i + 1).trim();
  }
  return out;
}
function jsonProblem(text, headersText) {
  if (!text.trim()) return null;
  let wantsJson = true;
  for (const line of headersText.split('\n')) { const m = line.match(/^\s*content-type\s*:\s*(.*)$/i); if (m) wantsJson = /json/i.test(m[1]); }
  if (!wantsJson) return null;
  try { JSON.parse(text); return null; } catch (e) { return e.message; }
}

function openEditor(c, savedTitle, opts = {}) {
  const drop = ['content-length', 'transfer-encoding', 'connection', 'matched-stub-id', 'matched-stub-name'];

    apply.disabled = !!bad; save.disabled = !!bad;
  };
  body.addEventListener('input', check); headers.addEventListener('input', check);
  apply.addEventListener('click', async () => {
    if (opts.onApply) { opts.onApply(payload()); closeDialog(); return; }
    try { await api('/api/custom', payload()); closeDialog(); refresh(); } catch (e) { msg.className = 'hint bad'; msg.textContent = e.message; }
  });
  save.addEventListener('click', async () => {
    if (!title.value.trim()) { msg.className = 'hint bad'; msg.textContent = 'Type a name first so you can find it later.'; title.focus(); return; }

    catch (e) { msg.className = 'hint bad'; msg.textContent = e.message; }
  });
  fill(dlgBody, 
    h('h2', { id: 'dlg-title' }, 'Respond to ' + c.method + ' ' + c.path),
    h('p', { class: 'hint' }, opts.onApply ? 'The app gets this instead of the stub\'s own answer. It is applied when you start.' : 'The app gets this instead, straight away. It lasts until you switch or stop the mock.'),
    opts.info ? h('p', { class: 'hint' }, opts.info) : null,
    opts.note ? h('p', { class: 'hint bad' }, opts.note) : null,
    h('div', { class: 'fields' }, field('Status', status), field('Delay (ms)', delay)),
    field('Headers, one per line', headers),
    field('Body', body, msg),
    opts.onApply ? null : h('div', { style: 'display:flex;gap:8px' }, h('div', { class: 'grow' }, title), save),
    h('div', { class: 'row2' },
      h('button', { class: 'btn', onclick: () => { try { body.value = JSON.stringify(JSON.parse(body.value), null, 2); check(); } catch {} } }, 'Format JSON'),
      h('button', { class: 'btn', onclick: closeDialog }, 'Cancel'), apply));
  check(); showDialog();
}

    const m = url.value.match(/^\s*git\s+clone\s+(?:-\S+\s+)*(\S+)/);
    if (m) url.value = m[1];
    showDest(); fill(help);
  });
  url.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') clone(); });
  async function clone() {
    if (!url.value.trim()) { url.focus(); return; }
    url.disabled = go.disabled = true; fill(go, h('span', { class: 'spin' }), 'Cloning…');
    fill(help, h('p', { class: 'hint', style: 'margin-top:10px' }, 'Downloading… a big repository can take a few minutes.'));
    try { await api('/api/project/clone', { url: url.value }); await loadProject(true); done && done(); }
    catch (e) { fill(help, e.data && e.data.kind === 'invalid' ? h('p', { class: 'hint bad', style: 'margin-top:8px' }, e.message) : cloneHelp(e, url.value, (p) => open(p, help), opened)); }
    finally { url.disabled = go.disabled = false; fill(go, 'Clone'); }
  }
  showDest();
  const clonePane = h('div', {}, h('div', { class: 'pathrow clonerow', style: 'margin-top:0' }, url, go), dest, help);

  // Folder on this Mac
  const path = h('input', { class: 'input', type: 'text', placeholder: '/Users/you/code/project', 'aria-label': 'Project folder path' });
  path.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') open(path.value); });
  const folderPane = h('div', {},
    proj.canPick ? h('button', { class: 'btn primary', onclick: pick }, icon('folder'), 'Choose folder…') : null,
    h('div', { style: proj.canPick ? 'margin-top:16px' : '' }, h('label', { class: 'lab' }, proj.canPick ? 'Or type its full path' : 'Type its full path'),
      h('div', { class: 'pathrow' }, path, h('button', { class: 'btn', onclick: () => open(path.value) }, 'Open'))));

  const modes = proj.cloneDir ? [['clone', 'Clone from Git', clonePane], ['folder', 'Folder on this Mac', folderPane]] : [['folder', '', folderPane]];
  let mode = store.get('chooser', (proj.recent || []).some((r) => r.exists) ? 'folder' : 'clone');
  if (!modes.some(([k]) => k === mode)) mode = modes[0][0];
  const tabs = h('div', { class: 'chooser-tabs', role: 'group', 'aria-label': 'How to add a project' }), pane = h('div', {});
  const show = () => {
    fill(tabs, modes.map(([k, label]) => h('button', { class: 'seg', 'aria-pressed': String(k === mode), onclick: () => { mode = k; store.set('chooser', k); msg.textContent = ''; fill(note); show(); } }, label)));
    fill(pane, modes.find(([k]) => k === mode)[2]);
  };
  show();

  const recentBox = h('div', {}), addLabel = h('label', { class: 'lab' }, 'Add a project');
  function drawRecents() {
    const rows = (proj.recent || []).map(recentRow);
    fill(recentBox, rows.length ? [h('label', { class: 'lab' }, 'Projects'), h('div', { class: 'recents' }, ...rows)] : null);
    recentBox.hidden = addLabel.hidden = !rows.length;
  }
  // recentRow opens a project; its side button deletes a clone Mockstro made, or only forgets a
  // folder the tester chose.
  function recentRow(r) {
    const current = proj.open && r.path === proj.path;
    const status = !r.folder ? ' (folder not found)' : !r.exists ? ' (not set up on this branch)' : '';
    const go = icon('right'); go.classList.add('go');
    const below = h('div', { class: 'rowpick' });
    const row = h('div', { class: 'recentrow' },
      h('button', { class: 'recent', ...(r.folder && !current ? {} : { disabled: '' }), onclick: () => { fill(note); document.querySelectorAll('.rowpick').forEach((el) => fill(el)); open(r.path, below); }, title: r.path },
        projIcon(r), h('span', { class: 'what' }, h('strong', {}, r.name), h('small', {}, r.path + status)),
        current ? h('span', { class: 'badge' }, 'Open now') : r.folder ? go : null));
    if (!current) row.append(h('button', { class: 'btn ghost sm rm', title: r.managed ? 'Delete this project' : 'Remove from list', 'aria-label': (r.managed ? 'Delete ' : 'Remove ') + r.name,
      onclick: () => (r.managed ? confirmDelete() : remove(false)) }, icon(r.managed ? 'trash' : 'x')));
    async function remove(del) {
      msg.textContent = '';
      try { await api('/api/project/remove', { path: r.path, delete: del }); proj = await api('/api/project'); drawRecents(); renderChrome(); }
      catch (e) { wrap.replaceWith(recentRow(r)); msg.className = 'hint bad'; msg.textContent = e.message; }
    }
    function confirmDelete() {
      const del = h('button', { class: 'btn sm danger-solid', onclick: () => { del.disabled = true; fill(del, h('span', { class: 'spin' }), 'Deleting…'); remove(true); } }, 'Delete');
      fill(row, h('div', { class: 'confirm', role: 'alertdialog', 'aria-label': 'Delete ' + r.name },
        icon('trash'),
        h('span', { class: 'what' }, h('strong', {}, 'Delete ' + r.name + '?'),
          h('small', {}, 'This deletes its folder from this Mac, including saved responses. You can clone it again later.')),
        h('button', { class: 'btn sm', onclick: () => wrap.replaceWith(recentRow(r)) }, 'Cancel'), del));
      del.focus();
    }
    const wrap = h('div', { class: 'recentitem' }, row, below);
    return wrap;
  }
  drawRecents();
  return h('div', { class: 'chooser' }, recentBox,
    h('div', {}, addLabel, modes.length > 1 ? tabs : null, pane, msg, note));
}

function openProjectDialog() {
  fill(dlgBody, 
    h('h2', { id: 'dlg-title' }, 'Open a project'),
    state.state !== 'idle' ? h('p', { class: 'hint bad' }, 'Stop the running mock first. You cannot change project while one is running.') : null,
    projectChooser(closeDialog),
    h('div', { class: 'row2' }, h('button', { class: 'btn', onclick: closeDialog }, 'Close')));
  showDialog();
}

// git: branch, update, switch
function gitSummary() {
  if (git.detached) return 'Not on a branch. Switch to one below.';
  if (!git.upstream) return 'This branch is not linked to a remote branch, so there is nothing to pull.';
  if (git.ahead > 0 && git.behind > 0) return 'Your copy and the remote have both changed, so it cannot update by itself. Ask a developer.';
  if (git.behind > 0) return git.behind + (git.behind === 1 ? ' new change is' : ' new changes are') + ' available.';
  if (git.ahead > 0) return 'You have ' + git.ahead + (git.ahead === 1 ? ' change' : ' changes') + ' that are not on the remote.';
  return 'Up to date as of the last check.';
}
async function openGitDialog() {
  await loadGit();
  if (!git || !git.repo) return;
  let branches = [], filter = '', msg = '', msgClass = 'hint';
  try { branches = await api('/api/git/branches'); } catch (e) { msg = e.message; msgClass = 'hint bad'; }
  const locked = () => state.state !== 'idle' || gitBusy;
  const dirty = () => git.dirty && git.dirty.length;
  async function act(label, fn) {
    gitBusy = true; msg = label + '…'; msgClass = 'hint'; draw();
    try { const r = await fn(); msg = (r && r.message) || 'Done.'; msgClass = 'hint good'; await loadProject(); }
    catch (e) { msg = e.message; msgClass = 'hint bad'; }
    gitBusy = false; await loadGit(); try { branches = await api('/api/git/branches'); } catch {} draw();
  }
  function draw() {
    const q = filter.trim().toLowerCase();
    const shown = branches.filter((b) => !q || b.name.toLowerCase().includes(q));
    fill(dlgBody, 
      h('h2', { id: 'dlg-title' }, 'Project version'),
      kvList([['Branch', git.branch + (git.upstream ? '  (follows ' + git.upstream + ')' : '')], git.commit ? ['Latest', git.commit.subject + ' · ' + git.commit.hash + ' · ' + git.commit.when] : null].filter(Boolean)),
      h('p', { class: 'hint' + (git.ahead > 0 && git.behind > 0 ? ' bad' : '') }, gitSummary()),
      dirty() ? h('p', { class: 'hint bad' }, 'These files have changes, so updating and switching are off: ' + git.dirty.slice(0, 10).join(', ') + '. Ask a developer.') : null,
      state.state !== 'idle' ? h('p', { class: 'hint bad' }, 'Stop the running mock first. Updating or switching changes the files it is using.') : null,
      h('div', { style: 'display:flex;gap:8px' },
        h('button', { class: 'btn', ...(gitBusy ? { disabled: '' } : {}), onclick: () => act('Checking for updates', () => api('/api/git/fetch', {})) }, 'Check for updates'),
        h('button', { class: 'btn' + (git.behind > 0 ? ' primary' : ''), ...(locked() || git.behind === 0 || dirty() ? { disabled: '' } : {}), onclick: () => act('Updating', () => api('/api/git/pull', {})) }, 'Update to latest')),
      field('Switch branch',
        h('input', { class: 'input', type: 'search', placeholder: 'Search branches', 'aria-label': 'Search branches', value: filter,
          oninput: (e) => { filter = e.target.value; draw(); const i = dlgBody.querySelector('input[type=search]'); i.focus(); i.setSelectionRange(filter.length, filter.length); } }),
        h('div', { class: 'branches' }, shown.length ? shown.map((b) => h('div', { class: 'branch' },
          h('span', { class: 'n' }, b.name, b.remote ? h('small', {}, '  (not on this Mac yet)') : null, b.current ? h('small', {}, '  (current)') : null),
          h('small', {}, b.when),
          h('button', { class: 'btn sm', ...(b.current || locked() || dirty() ? { disabled: '' } : {}), onclick: () => act('Switching to ' + b.name, () => api('/api/git/switch', { branch: b.name })) }, 'Switch'))) : h('div', { class: 'branch' }, 'No branches with the Mockstro integration match.'))),
      h('p', { class: msgClass, role: 'status', 'aria-live': 'polite' }, msg),
      h('div', { class: 'row2' }, h('button', { class: 'btn', onclick: closeDialog }, 'Close')));
  }
  draw(); showDialog();
}

(async () => {
  await loadProject(true);
  setInterval(refresh, 1000);
  setInterval(refreshJournal, 1000);
  setInterval(checkHealth, 5000);
  setInterval(() => loadGit(), 30000);
})();
</script>
